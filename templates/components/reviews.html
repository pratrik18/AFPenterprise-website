<section class="section section--dark" id="recenzie">

  <div class="container">

    <div class="section__head">
      <span class="section__index">F04</span>
      <h2 class="section-title">Recenzie</h2>
    </div>

    <div class="reviews-carousel{% if reviews|length <= 3 %} reviews-carousel--static{% endif %}">
      {% if reviews|length > 3 %}
      <button
        class="reviews-carousel__arrow"
        type="button"
        data-reviews-prev
        aria-label="Predchádzajúce recenzie"
        aria-controls="reviewsTrack"
      >
        <span aria-hidden="true">←</span>
      </button>
      {% endif %}

      <div class="reviews-grid" id="reviewsTrack" aria-label="Recenzie zákazníkov">

  {% for review in reviews %}

    <article class="review-card">

      <span class="review-card__stars">
        {% for i in range(review.rating) %}★{% endfor %}
      </span>

      <p class="review-card__quote">
        {{ review.review }}
      </p>

      <p class="review-card__author">
        {{ review.name }}
      </p>

      <p class="review-card__role">
        {{ review.service }}
      </p>

    </article>

  {% endfor %}

      </div>

      {% if reviews|length > 3 %}
      <button
        class="reviews-carousel__arrow"
        type="button"
        data-reviews-next
        aria-label="Ďalšie recenzie"
        aria-controls="reviewsTrack"
      >
        <span aria-hidden="true">→</span>
      </button>
      {% endif %}
    </div>

    </div>

  </div>

</section>
