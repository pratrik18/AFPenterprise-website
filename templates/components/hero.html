<section class="hero" data-scroll-expand>
  <div class="hero__stage">
    <div class="hero__frame" aria-hidden="true">
      <div class="molten-metal-bg"></div>
    </div>

    <div class="hero__brand">
      <h1 class="hero__title">
        <img
          src="{{ url_for('static', filename='images/logo-afp.png') }}"
          alt="AFP"
          class="hero__title-img"
          fetchpriority="high"
        >
      </h1>
    </div>

    <div class="hero__overlay">
      <h2 class="hero__title_description">
        <span class="hero__service">Tvoríme atmosféru</span>
      </h2>

      <div class="hero__mobile-actions">
        <a class="hero__mobile-button hero__mobile-button--primary specular-submit specular-submit--lg" href="#kontakt">
          <span class="specular-submit__fx" aria-hidden="true"></span>
          <span class="specular-submit__label">Začíname projekt</span>
        </a>
        <a class="hero__mobile-button hero__mobile-button--secondary specular-submit specular-submit--lg" href="#portfolio">
          <span class="specular-submit__fx" aria-hidden="true"></span>
          <span class="specular-submit__label">Zobraziť portfólio</span>
        </a>
      </div>
    </div>

    <p class="hero__scroll-hint" aria-hidden="true">POSUŇTE NADOL</p>
  </div>
</section>
